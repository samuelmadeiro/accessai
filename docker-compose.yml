# Orquestracao local do AccessAI.
#
# Postgres, Kafka, Redis e o ML Service.
#
# O Redis entrou na Slice 5A, quando passou a ter funcao: rate limit POR
# USUARIO exige que usuario exista. A deduplicacao de consumer ficou no Postgres
# (`evento_processado`), que o §5 permite — "chave persistida OU em Redis". O
# terceiro uso do D4, contador de gasto de LLM, chega com a Slice 6.
#
# Nenhuma credencial literal neste arquivo: tudo vem do .env.

services:
  postgres:
    image: postgres:16.15
    container_name: accessai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      # pg_isready sozinho responde antes de o banco aceitar conexao de fato.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    # Modo KRaft: um unico processo faz broker e controller, sem ZooKeeper.
    image: apache/kafka:4.3.1
    container_name: accessai-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNO://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},INTERNO://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      # Broker unico: replicacao 1 em tudo, senao os topicos internos nao criam.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-dados:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Entra na Slice 5A, com funcao: rate limit por usuario. Sem persistencia —
  # contador de janela nao precisa sobreviver a restart, e um volume aqui daria
  # a impressao de que precisa.
  redis:
    image: redis:8.2-alpine
    container_name: accessai-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Contexto na raiz porque o build precisa de docs/wcag/criteria.json,
      # que e contrato do projeto e nao pertence ao modulo backend.
      context: .
      dockerfile: backend/Dockerfile
    container_name: accessai-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNO}
      ACCESSAI_UPLOAD_TAMANHO_MAXIMO: ${ACCESSAI_UPLOAD_TAMANHO_MAXIMO}
      ACCESSAI_JWT_SECRET: ${ACCESSAI_JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Nome do servico na rede do compose, nao localhost.
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ml-service:
    # Sem Dockerfile proprio ainda: a imagem e construida do contexto do modulo.
    build:
      context: ./ml-service
    container_name: accessai-ml-service
    environment:
      # A pasta viaja na imagem. Sem artefato dentro, o servico sobe assim mesmo
      # e responde pela heuristica — e o /health diz isso.
      ACCESSAI_MODELOS: /app/models
    ports:
      - "${ML_SERVICE_PORT}:8000"
    healthcheck:
      # /health responde 200 mesmo sem modelo carregado, de proposito: 503 ali
      # faria o compose reiniciar em loop um container que esta saudavel.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-dados:
  kafka-dados:
