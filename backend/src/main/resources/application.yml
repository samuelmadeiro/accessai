spring:
  application:
    name: accessai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accessai}
    username: ${SPRING_DATASOURCE_USERNAME:accessai}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # O dono do schema e o Flyway. Hibernate nunca altera tabela.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Fora do compose vale KAFKA_BOOTSTRAP_SERVERS (host); dentro do compose o
    # proprio compose injeta SPRING_KAFKA_BOOTSTRAP_SERVERS com o listener
    # interno. Nenhum dos dois fica sem dono.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3. O Boot 4.1 nao traz mais jackson-databind (Jackson 2), entao
      # o antigo JsonSerializer do spring-kafka nao tem classe de apoio no
      # classpath. As duas familias convivem no jar; usar a errada so falha em
      # runtime.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: accessai-analise
      auto-offset-reset: earliest
      # ErrorHandlingDeserializer envolve o desserializador de verdade. Sem ele,
      # JSON invalido no topico explode DENTRO do poll(), antes de existir um
      # registro para o DefaultErrorHandler tratar: o container repolla o mesmo
      # offset para sempre e o pipeline inteiro para. Com ele, a falha vira um
      # cabecalho de excecao no registro e segue o caminho normal de retry/DLT.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # O consumidor decide o tipo; nao aceita o que o produtor mandar no header.
        spring.json.use.type.headers: false
        spring.json.value.default.type: dev.accessai.analise.evento.AnaliseSolicitadaV1
    listener:
      ack-mode: record

  servlet:
    multipart:
      # Fonte unica do limite: accessai.upload.tamanho-maximo, la embaixo.
      # Repetir a variavel de ambiente aqui criava dois lugares para mudar o
      # mesmo numero, e um deles ia ficar para tras.
      max-file-size: ${accessai.upload.tamanho-maximo}
      max-request-size: ${accessai.upload.tamanho-maximo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

accessai:
  upload:
    # Quem enforca e o multipart do Spring (acima). Este valor tambem e lido
    # pelo tratador de erros, para que a mensagem de recusa cite o limite real
    # em vez de um texto generico.
    tamanho-maximo: ${ACCESSAI_UPLOAD_TAMANHO_MAXIMO:25MB}
  kafka:
    topico-analise-solicitada: accessai.analise.solicitada.v1
    particoes: 3
    replicas: 1
    # Backoff exponencial: 500ms, 1s, 2s, 4s. Esgotadas as tentativas, a
    # mensagem vai para <topico>.DLT e a analise e marcada como FALHOU.
    retry:
      tentativas: 4
      intervalo-inicial-ms: 500
      multiplicador: 2.0
      intervalo-maximo-ms: 10000
  outbox:
    # Intervalo curto porque o upload e sincrono para o usuario: ele recebe 201 e
    # espera o processamento comecar logo. O custo e um SELECT por ciclo num
    # indice parcial que so cobre pendentes.
    intervalo-ms: 500
    tamanho-do-lote: 50
    # Timeout por evento e orcamento do lote inteiro. O produto dos dois e o
    # tempo maximo que a transacao segura as linhas travadas e a conexao do
    # pool; sem o orcamento, um broker LENTO (nao caido) prenderia 50 x timeout.
    timeout-de-publicacao-ms: 2000
    orcamento-do-lote-ms: 10000
    # Evento que falhou esta quantidade de vezes sai da fila de publicacao. Sem
    # este teto, uma linha impublicavel em definitivo e retentada para sempre e,
    # somadas o bastante, elas ocupam o lote inteiro e nenhum evento novo sai.
    max-tentativas: 10
  ml-service:
    # Fora do compose vale localhost; dentro, o compose injeta o nome do
    # servico. Nenhum dos dois fica sem dono.
    url: ${ML_SERVICE_URL:http://localhost:8000}
    # Curtos de proposito: a chamada roda dentro do consumo de uma mensagem do
    # Kafka, e esperar por um servico degradado segura a particao inteira.
    connect-timeout-ms: 500
    read-timeout-ms: 1500
  score:
    # Peso de cada principio WCAG na nota global. Iguais por padrao: nao ha
    # evidencia publicada para hierarquizar principios, e um 35/30/25/10
    # inventado daria ao score uma precisao que ele nao tem. Principio sem
    # nenhuma regra implementada fica FORA da media, com os pesos
    # renormalizados — nao entra valendo 100.
    pesos:
      perceptivel: 25
      operavel: 25
      compreensivel: 25
      robusto: 25
    # Pontos descontados por problema. A escala foi escolhida para que sete
    # problemas de severidade ALTA zerem uma categoria.
    penalidades:
      critica: 25
      alta: 15
      media: 8
      baixa: 3

logging:
  level:
    dev.accessai: INFO
  # O correlationId entra em TODA linha de log. Sem isso ele existiria no MDC e
  # nao apareceria em lugar nenhum, que e o mesmo que nao existir.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sem-correlacao}] %logger{36} - %msg%n"
